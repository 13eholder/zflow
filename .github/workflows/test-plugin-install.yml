name: Validate skills and commands

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-skills:
    name: Validate skill content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate all skills
        run: node scripts/validate-skills.js

      - name: Test skill eval runner
        run: node --test scripts/run-evals-test.js

      - name: Run skill evals (trigger + routing)
        run: node scripts/run-evals.js --min-rank1 80

  validate-commands:
    name: Validate command manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate supported command manifests
        run: node scripts/validate-commands.js
